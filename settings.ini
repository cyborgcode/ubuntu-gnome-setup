# GNOME settings, loaded by install.sh with `dconf load / < settings.ini`.
# Only keys changed from Ubuntu's defaults are here; the wallpaper path is set by install.sh, since it depends on $HOME.

[org/gnome/desktop/interface]
clock-show-seconds=false
clock-show-weekday=true
color-scheme='prefer-dark'
enable-animations=true
enable-hot-corners=true
font-antialiasing='rgba'
gtk-enable-primary-paste=true
gtk-theme='Yaru-dark'
icon-theme='Yaru-dark'
text-scaling-factor=1.25

[org/gnome/desktop/input-sources]
sources=[('xkb', 'fr')]

[org/gnome/desktop/peripherals/keyboard]
numlock-state=false
repeat=true

[org/gnome/desktop/peripherals/touchpad]
disable-while-typing=false
speed=0.10000000000000001
two-finger-scrolling-enabled=true

[org/gnome/desktop/a11y]
always-show-universal-access-status=true

[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/privacy]
report-technical-problems=false

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=true
night-light-temperature=uint32 3673

[org/gnome/settings-daemon/plugins/power]
lid-close-ac-action='suspend'
lid-close-battery-action='suspend'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/shell]
enabled-extensions=['caffeine@patapon.info', 'clipboard-indicator@tudmotu.com', 'gaze@gundulabs.com', 'filee-donut@filee.sh', 'filee-tray-toggle@local', 'quick-settings-scroll@rayen.local', 'fluxcast@rayen.local', 'gdrive-sync@local', 'puffdrop@cyborgcode.github.io']
favorite-apps=['firefox_firefox.desktop', 'Beeper.desktop', 'org.gnome.Rhythmbox3.desktop', 'snap-store_snap-store.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'com.anthropic.Claude.desktop', 'code_code.desktop']

[org/gnome/shell/ubuntu]
startup-sound=''

[org/gnome/shell/extensions/appindicator]
icon-brightness=0.0
icon-contrast=0.0
icon-opacity=240
icon-saturation=0.0
icon-size=0

[org/gnome/shell/extensions/caffeine]
cli-toggle=false
countdown-timer=3000
duration-timer=4
duration-timer-list=[1800, 3000, 4800]
indicator-position=0
indicator-position-index=0
indicator-position-max=4
restore-state=true
screen-blank='always'
show-indicator='always'
toggle-shortcut=['<Super>c']
use-custom-duration=false

[org/gnome/shell/extensions/clipboard-indicator]
blink-icon-on-copy=false
confirm-clear=false
disable-down-arrow=true
display-mode=3
open-at-cursor=true
paste-button=false
preview-size=40
show-edit-button=true
show-private-mode=false
show-tag-button=false
toggle-menu=['<Alt>w']

[org/gnome/shell/extensions/dash-to-dock]
background-opacity=0.80000000000000004
dash-max-icon-size=48
dock-fixed=true
dock-position='LEFT'
extend-height=true
height-fraction=0.90000000000000002
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'

[org/gnome/shell/extensions/gaze]
enable-face-authentication=true

[org/gnome/shell/extensions/tiling-assistant]
focus-hint-color='rgb(211,70,21)'
tiling-popup-all-workspace=true
